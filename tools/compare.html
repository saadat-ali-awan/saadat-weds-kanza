<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Source vs React</title>
    <style>
      body { margin: 0; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
      .row { display: flex; gap: 16px; justify-content: center; padding: 16px; }
      .col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .box { width: 430px; height: 932px; overflow: hidden; position: relative; background: #000; }
      /* source video scaled exactly like the player: fill height, crop the sides evenly */
      video { position: absolute; height: 932px; left: 50%; transform: translateX(-50%); }
      iframe { width: 430px; height: 932px; border: 0; }
      .bar { position: sticky; bottom: 0; display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: #1b1b1b; }
      input[type=range] { flex: 1; }
      button { background: #333; color: #eee; border: 1px solid #555; padding: 6px 12px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="col"><div class="box"><video id="v" src="./source.mp4" muted playsinline></video></div>Source video</div>
      <div class="col"><iframe id="f" src="/?frame=0"></iframe>React</div>
    </div>
    <div class="bar">
      <button id="prev">◀ frame</button>
      <button id="play">Play</button>
      <button id="next">frame ▶</button>
      <input id="s" type="range" min="0" max="1096" value="0" />
      <span id="lbl">#0</span>
    </div>
    <script type="module">
      const tl = await fetch('/src/data/timeline.json').then((r) => r.json())
      const v = document.getElementById('v'), f = document.getElementById('f'), s = document.getElementById('s'), lbl = document.getElementById('lbl')
      let frame = 0, playing = false
      const show = (i) => {
        frame = Math.max(0, Math.min(tl.frameTimes.length - 1, i))
        const t = tl.frameTimes[frame]
        s.value = frame
        lbl.textContent = `#${frame}  ${t.toFixed(3)}s`
        if (!playing) v.currentTime = t + 0.001
        f.contentWindow.__render?.(t)
      }
      s.oninput = () => show(+s.value)
      document.getElementById('prev').onclick = () => show(frame - 1)
      document.getElementById('next').onclick = () => show(frame + 1)
      document.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') show(frame - 1); if (e.key === 'ArrowRight') show(frame + 1) })
      document.getElementById('play').onclick = (e) => {
        playing = !playing
        e.target.textContent = playing ? 'Pause' : 'Play'
        if (playing) {
          v.play()
          const tick = () => {
            if (!playing) return
            const t = v.currentTime
            f.contentWindow.__render?.(t)
            let i = frame; while (i + 1 < tl.frameTimes.length && tl.frameTimes[i + 1] <= t) i++
            frame = i; s.value = i; lbl.textContent = `#${i}  ${t.toFixed(3)}s`
            if (!v.ended) requestAnimationFrame(tick); else { playing = false; e.target.textContent = 'Play' }
          }
          requestAnimationFrame(tick)
        } else v.pause()
      }
      f.onload = () => setTimeout(() => show(0), 300)
    </script>
  </body>
</html>
